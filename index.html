    <script>
      // SPA redirect handling for GitHub Pages
      // Converts hash-based URLs (from 404.html redirect) back to path-based URLs
      (function() {
        var basePath = '/calm-shop/';
        var hash = window.location.hash;

        if (hash && hash.startsWith('#')) {
          // Remove the hash and replace with path
          var path = hash.substring(1);
          // Replace the current URL without adding to history
          window.history.replaceState(null, null, basePath + path);
        }
      })();
    </script>
