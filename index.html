      // SPA redirect handling for GitHub Pages
      // Handles redirect from 404.html with query parameter
      (function() {
        var basePath = '/calm-shop/';
        var searchParams = new URLSearchParams(window.location.search);
        var redirectPath = searchParams.get('redirect');

        if (redirectPath) {
          // Remove the redirect parameter and replace with clean path
          window.history.replaceState(null, null, basePath + redirectPath);
        }
      })();
